name: Eval AI tutor hints

# E1 test set (hub BO_TEST v0.1 §3): real Sonnet + Haiku calls with the parent's test-set key (secret ANTHROPIC_API_KEY, its own cap).
# Manual only. When to run (hub Q5, 22/11):
#   - prompt change only → set "bo_test" (24 cases × runs, about 1 USD);
#   - model change, big change, or before opening a new feature to the children → "full" (+ 193 Destination questions, about 7 USD),
#     after telling the parent the estimate.
# Book material is never in git (hub Q1): the Destination files are fetched from the private Storage bucket `eval-sources`.
# Full results (with question text) are a run artifact kept 90 days; the job summary shows only the table + flagged ids.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: "bo_test (≈1 USD) hoặc full (≈7 USD, cả đề Destination)"
        type: choice
        options: [bo_test, full]
        default: bo_test
      runs:
        description: "Runs per BO_TEST case"
        default: "3"
      max_usd:
        description: "Stop starting new work past this spend (USD)"
        default: "10"

permissions:
  contents: read

concurrency:
  group: eval-hints
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch the Destination questions (full only)
        if: ${{ inputs.scope == 'full' }}
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
        run: npx tsx scripts/eval-sources.ts download "$RUNNER_TEMP/destination"
      - name: Run the test set
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCOPE: ${{ inputs.scope }}
          RUNS: ${{ inputs.runs }}
          MAX_USD: ${{ inputs.max_usd }}
        # Inputs reach the shell only as env values and must be plain numbers.
        run: |
          set -euo pipefail
          [[ "$RUNS" =~ ^[1-9]$ ]] || { echo "runs must be 1-9"; exit 1; }
          [[ "$MAX_USD" =~ ^[0-9]{1,2}(\.[0-9]+)?$ ]] || { echo "max_usd must be a number below 100"; exit 1; }
          dest=none
          [ "$SCOPE" = "full" ] && dest="$RUNNER_TEMP/destination"
          npx tsx scripts/eval-hints.ts --runs "$RUNS" --max-usd "$MAX_USD" --destination "$dest" --out "$RUNNER_TEMP/results"
          cat "$RUNNER_TEMP"/results/*/summary.public.md >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the full results as a run artifact (90 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-hints-results
          path: ${{ runner.temp }}/results
          retention-days: 90
          if-no-files-found: ignore
