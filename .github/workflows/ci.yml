name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck · lint · unit · build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - name: Seed migrations match content/*.json + version lock (no drift, no edits to published versions)
        run: npm run gen:config -- --check
      - name: Build (no secrets needed — env is read at request time)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  db:
    name: DB tests (Postgres 16 + Supabase/Launcher stub)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: DB tests (each test file creates its own database with the stub)
        run: npm run test:db
      - name: db:apply CLI on a stub database (twice — must be a no-op the 2nd time) + seed
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ci_apply
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -qc "create database ci_apply"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f db/stub/supabase_stub.sql
          npm run db:apply
          npm run db:apply | tee /tmp/second.txt
          grep -q "nothing to apply" /tmp/second.txt
          npm run db:seed-dev -- --auth=stub
          npm run db:seed-dev -- --auth=stub
          test "$(psql "$DATABASE_URL" -tAc "select count(*) from english.learners where is_test = false")" = "0"

  e2e:
    name: E2E smoke (Playwright + real local Supabase)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # CI-only throwaway values for a stack that lives and dies inside this job.
      SEED_DEV_PASSWORD: ci-only-e2e-password-1234
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      # PostgREST is configured with db-schemas=public,english but `english` does not exist
      # until db:apply runs, so its health check cannot pass yet — hence --ignore-health-check
      # here and an explicit wait for the API after the migrations (below).
      - name: Start local Supabase (auth + PostgREST + Postgres only; config in supabase/config.toml)
        run: |
          set -o pipefail
          supabase start --ignore-health-check 2>&1 | tee -a "$RUNNER_TEMP/e2e.log"

      - name: Apply our migrations on real Supabase Postgres (twice — 2nd must be a no-op)
        run: |
          set -euo pipefail
          npm run db:apply 2>&1 | tee -a "$RUNNER_TEMP/e2e.log"
          npm run db:apply 2>&1 | tee -a "$RUNNER_TEMP/e2e.log" | tee /tmp/second.txt
          grep -q "nothing to apply" /tmp/second.txt

      - name: Read local Supabase keys
        run: |
          set -euo pipefail
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          set -a
          . "$RUNNER_TEMP/supabase.env"
          set +a
          : "${API_URL:?}" "${ANON_KEY:?}" "${SERVICE_ROLE_KEY:?}"
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Wait until Auth and PostgREST serve schema english
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/e2e.log") 2>&1
          psql "$DATABASE_URL" -qc "notify pgrst, 'reload schema'"
          for i in $(seq 1 60); do
            auth=$(curl -s -o /dev/null -w '%{http_code}' "$NEXT_PUBLIC_SUPABASE_URL/auth/v1/health" -H "apikey: $NEXT_PUBLIC_SUPABASE_ANON_KEY" || true)
            # 406 = "Invalid schema: english" (schema cache not loaded yet); anything else means english is exposed.
            rest=$(curl -s -o /dev/null -w '%{http_code}' "$NEXT_PUBLIC_SUPABASE_URL/rest/v1/learners?select=id&limit=1" -H "apikey: $NEXT_PUBLIC_SUPABASE_ANON_KEY" -H "Accept-Profile: english" || true)
            echo "attempt $i: auth=$auth rest=$rest"
            if [ "$auth" = "200" ] && [ "$rest" != "406" ] && [ "$rest" != "000" ] && [ "$rest" != "503" ]; then exit 0; fi
            sleep 2
          done
          echo "Supabase did not become ready"; exit 1

      - name: Seed the TEST family (real Auth Admin API)
        run: |
          set -o pipefail
          npm run db:seed-dev 2>&1 | tee -a "$RUNNER_TEMP/e2e.log"

      - name: Build and start the app (ALLOW_REAL_LEARNERS=false)
        env:
          ALLOW_REAL_LEARNERS: "false"
        run: |
          set -euo pipefail
          npm run build
          nohup npm start -- --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/next.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null http://127.0.0.1:3000/login && exit 0
            sleep 1
          done
          echo "App did not come up:"; cat "$RUNNER_TEMP/next.log"; exit 1

      - run: npx playwright install --with-deps chromium

      - name: Run Playwright
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee -a "$RUNNER_TEMP/e2e.log"

      - name: Diagnostics (failure only)
        if: failure()
        run: |
          {
            echo "=== next.log ==="; tail -n 40 "$RUNNER_TEMP/next.log" 2>&1 || true
            for c in $(docker ps -a --format '{{.Names}}' | grep -E 'auth|rest|db' || true); do
              echo "=== container $c ==="; docker logs --tail 25 "$c" 2>&1 || true
            done
          } > "$RUNNER_TEMP/diag.log" 2>&1
          cat "$RUNNER_TEMP/diag.log"
          # Raw run logs are not always downloadable, so also surface them as annotations.
          .github/scripts/annotate-log.sh "$RUNNER_TEMP/e2e.log" "step output" 60
          .github/scripts/annotate-log.sh "$RUNNER_TEMP/diag.log" "app and container logs" 80

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
