name: Seed test family

# Manual only — the parent presses "Run workflow" and types SEED to confirm.
# Runs `npm run db:seed-dev` against the real Supabase project: creates the TEST family only
# (is_test = true): 1 parent, 2 tutors, "An (thử)", "Nguyên (thử)" with emails eng-test-…@example.com,
# all sharing the password in secret SEED_DEV_PASSWORD. Idempotent — running again changes nothing.
# Never creates real learners.
# mode = throwaway (S5c): instead adds ONE extra test learner "Em thử xóa xxxxxx" to the test family (`npm run db:seed-throwaway`), to try the
# "Xóa dữ liệu của em" screen on. Needs only DATABASE_URL; refuses to run unless the test family holds test learners only.
#
# Secrets: DATABASE_URL, SUPABASE_SERVICE_ROLE_KEY, SEED_DEV_PASSWORD (≥ 12 characters)
# Variables: NEXT_PUBLIC_SUPABASE_URL

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'family = tạo gia đình THỬ · throwaway = thêm 1 em thử để thử màn Xóa dữ liệu'
        type: choice
        options:
          - family
          - throwaway
        default: family
      confirm:
        description: 'Gõ SEED để xác nhận tạo gia đình THỬ'
        required: true
        default: ''

permissions:
  contents: read

concurrency:
  group: seed-test-family
  cancel-in-progress: false

jobs:
  seed:
    if: ${{ inputs.confirm == 'SEED' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check secrets are present (without printing them)
        env:
          MODE: ${{ inputs.mode }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SEED_DEV_PASSWORD: ${{ secrets.SEED_DEV_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
        run: |
          missing=""
          needed="DATABASE_URL SUPABASE_SERVICE_ROLE_KEY SEED_DEV_PASSWORD NEXT_PUBLIC_SUPABASE_URL"
          if [ "$MODE" = "throwaway" ]; then needed="DATABASE_URL"; fi
          for v in $needed; do
            test -n "${!v}" || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing:$missing"
            echo "Thiếu:$missing — thêm ở Settings → Secrets and variables → Actions." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Add one throwaway test learner (mode = throwaway)
        if: ${{ inputs.mode == 'throwaway' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          npm run db:seed-throwaway | tee /tmp/throwaway.txt
          {
            echo "## Em thử để xóa"
            echo
            echo '```'
            grep -v -i "postgres://\|postgresql://\|sb_secret_" /tmp/throwaway.txt | grep -v "^>" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Create the test family
        if: ${{ inputs.mode != 'throwaway' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SEED_DEV_PASSWORD: ${{ secrets.SEED_DEV_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
        run: |
          set -euo pipefail
          npm run db:seed-dev | tee /tmp/seed.txt
          {
            echo "## Gia đình THỬ"
            echo
            echo '```'
            grep -v -i "postgres://\|postgresql://\|sb_secret_" /tmp/seed.txt | grep -v "^>" || true
            echo '```'
            echo
            echo "Đăng nhập app bằng một trong các email trên, mật khẩu = giá trị secret SEED_DEV_PASSWORD."
          } >> "$GITHUB_STEP_SUMMARY"

  not-confirmed:
    if: ${{ inputs.confirm != 'SEED' }}
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "Chưa tạo gì: ô xác nhận phải là SEED." >> "$GITHUB_STEP_SUMMARY"
          exit 1
