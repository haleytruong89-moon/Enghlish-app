name: Reset password

# Manual only — the parent presses "Run workflow" and types RESET to confirm.
# Runs `npm run db:reset-password` against the real Supabase project: sets a NEW password for ONE member of the family
# (the person must have a row in english.members of the chosen family, so an unrelated Launcher-only user is refused).
# Why: accounts are shared with Study Launcher and the app has no "forgot password" flow. The Launcher password changes too.
#
# Steps for the parent:
#   1. Settings → Secrets and variables → Actions → New secret RESET_PASSWORD (≥ 12 characters).
#   2. Actions → Reset password → Run workflow: login = short name (an) or email, family = real, confirm = RESET.
#   3. Delete the secret RESET_PASSWORD afterwards.
# Exit codes of the script: 0 done · 1 not done / maybe not done · 3 password changed but the audit row was not saved.
# The password is never printed and never written to the audit log (english.audit_log only gets role + kind of login).
#
# Secrets: DATABASE_URL, SUPABASE_SERVICE_ROLE_KEY, RESET_PASSWORD
# Variables: NEXT_PUBLIC_SUPABASE_URL

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Gõ RESET để xác nhận'
        required: true
        default: ''
      login:
        description: 'Tên đăng nhập ngắn (vd. an) hoặc email'
        required: true
      family:
        description: 'Gia đình'
        required: true
        type: choice
        default: real
        options:
          - real
          - test

permissions:
  contents: read

concurrency:
  group: reset-password
  cancel-in-progress: false

jobs:
  reset:
    if: ${{ inputs.confirm == 'RESET' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check the confirmation (exact case)
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "RESET" ]; then
            echo "Chưa đặt lại gì: ô xác nhận phải là đúng chữ RESET (viết hoa)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check secrets are present (without printing them)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESET_PASSWORD: ${{ secrets.RESET_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
        run: |
          missing=""
          for v in DATABASE_URL SUPABASE_SERVICE_ROLE_KEY RESET_PASSWORD NEXT_PUBLIC_SUPABASE_URL; do
            test -n "${!v}" || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing:$missing"
            echo "Thiếu:$missing — thêm ở Settings → Secrets and variables → Actions." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Reset the password
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESET_PASSWORD: ${{ secrets.RESET_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          # Inputs go through env (never interpolated into the shell script) and are validated by the script.
          RESET_LOGIN: ${{ inputs.login }}
          RESET_FAMILY: ${{ inputs.family }}
        run: |
          set -uo pipefail
          # Lines that contain the password itself are dropped too (on top of GitHub's own masking). An empty password
          # gives an EMPTY pattern file, which matches nothing (a file with an empty line would match every line).
          pwfile="$(mktemp)"
          printf '%s\n' "$RESET_PASSWORD" | grep -v '^$' > "$pwfile" || true
          scrub() { grep -v -i "postgres://\|postgresql://\|sb_secret_\|eyJ" | grep -vF -f "$pwfile"; }
          status=0
          npm run db:reset-password > /tmp/reset.txt 2>&1 || status=$?
          # The script prints these marker lines: the first right BEFORE the Supabase call, the second right AFTER it succeeded.
          sent=0
          changed=0
          grep -q "^Đang gửi yêu cầu đổi mật khẩu" /tmp/reset.txt && sent=1
          grep -q "^Đã đổi mật khẩu" /tmp/reset.txt && changed=1
          {
            if [ "$status" -eq 0 ]; then
              echo "## Đã đặt lại mật khẩu"
            elif [ "$changed" -eq 1 ]; then
              echo "## Mật khẩu ĐÃ đổi (nhưng lần chạy báo lỗi)"
            elif [ "$sent" -eq 1 ]; then
              echo "## Chưa chắc đã đổi được mật khẩu"
            else
              echo "## Chưa đặt lại được mật khẩu"
            fi
            echo
            echo '```'
            scrub < /tmp/reset.txt | grep -v "^>" || true
            echo '```'
            echo
            if [ "$status" -eq 0 ]; then
              echo "Đưa mật khẩu mới cho người đó qua kênh riêng (không gửi trong nhóm chung). Người đó đăng nhập xong nên bấm **Đổi mật khẩu** và đặt mật khẩu của riêng mình."
              echo "Tài khoản dùng chung Study Launcher nên mật khẩu bên Launcher cũng đổi."
              echo "Những phiên đăng nhập đang mở của người đó không bị đăng xuất."
            elif [ "$status" -eq 3 ]; then
              echo "Mật khẩu ĐÃ đổi (đăng nhập bằng mật khẩu mới được) nhưng chưa ghi được dòng nhật ký — báo dev."
            elif [ "$changed" -eq 1 ]; then
              echo "Mật khẩu ĐÃ đổi (Supabase đã xác nhận); xem lỗi ở trên."
            elif [ "$sent" -eq 1 ]; then
              echo "Có thể chưa đổi — thử đăng nhập bằng mật khẩu mới trước khi chạy lại."
            else
              echo "Mật khẩu chưa đổi. Sửa theo dòng báo lỗi ở trên rồi chạy lại."
            fi
            echo
            echo "**Việc cần làm ngay: xóa secret \`RESET_PASSWORD\`** ở Settings → Secrets and variables → Actions."
          } >> "$GITHUB_STEP_SUMMARY"
          scrub < /tmp/reset.txt || true
          rm -f "$pwfile"
          exit "$status"

  not-confirmed:
    if: ${{ inputs.confirm != 'RESET' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: |
          echo "Chưa đặt lại gì: ô xác nhận phải là RESET." >> "$GITHUB_STEP_SUMMARY"
          exit 1
